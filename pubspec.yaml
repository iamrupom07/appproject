name: ab_abroz_inventory
description: AB & Abroz Machinery inventory app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  go_router: ^13.2.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.2.6
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  flutter_carousel_widget: ^3.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1 # ← NEW

# ─── App Icon Configuration ────────────────────────────────────────────────────
flutter_launcher_icons:
  # Source image — must be square, ≥1024×1024, PNG with transparency
  image_path: "assets/icons/app_icon.png"

  # ── Android ────────────────────────────────────────────────────────────────
  android: true
  # Adaptive icon: a foreground layer (logo) over a coloured background layer.
  # This gives the modern rounded/squircle look on Android 8+.
  adaptive_icon_foreground: "assets/icons/app_icon_adaptive_fg.png"
  adaptive_icon_background: "#1A1A2E" # Deep Charcoal — AB & Abroz brand dark

  # ── iOS ────────────────────────────────────────────────────────────────────
  ios: true
  remove_alpha_ios: true # App Store requires no transparency on iOS icons

  # ── Web (PWA) ──────────────────────────────────────────────────────────────
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#1A1A2E"
    theme_color: "#E8B84B" # Gold accent

  # ── Windows desktop ───────────────────────────────────────────────────────
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/images/
