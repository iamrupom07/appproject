name: abroz_parts_plus
description: >-
  Abroz Parts+ is a smart spare parts platform designed for heavy equipment owners,
  operators, and contractors across the Philippines. Specialized in Komatsu machinery
  support, the app helps users quickly inquire about parts, receive technical assistance,
  check availability, and coordinate service support efficiently. Built to reduce downtime
  and simplify spare parts management, Abroz Parts+ connects customers with reliable
  solutions anytime, anywhere.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  go_router: ^13.2.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.2.6
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  flutter_carousel_widget: ^3.1.0
  intl: ^0.19.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

# ─── App Icon Configuration ────────────────────────────────────────────────────
flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"

  android: true
  adaptive_icon_foreground: "assets/icons/app_icon_adaptive_fg.png"
  adaptive_icon_background: "#FFFFFF"

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#E8B84B"

  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/images/
